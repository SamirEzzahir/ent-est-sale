services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ent-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import
    ports:
      - "8080:8080"

  auth:
    build:
      context: ./backend
    container_name: ent-auth
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - keycloak

  minio:
    image: minio/minio:latest
    container_name: ent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  cassandra:
    image: cassandra:4.1
    container_name: ent-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra

  upload:
    build:
      context: ./backend/upload-service
    container_name: ent-upload
    env_file:
      - ./backend/upload-service/.env
    ports:
      - "8002:8002"
    depends_on:
      - keycloak
      - minio
      - cassandra

  frontend:
    image: node:20-alpine
    container_name: ent-frontend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    depends_on:
      - auth
      - upload

volumes:
  minio-data:
  cassandra-data:
