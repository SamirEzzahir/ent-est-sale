services:

  # =====================
  # FRONTEND
  # =====================
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - core-auth
    networks:
      - app-network

  # =====================
  # CORE AUTH
  # =====================
  core-auth:
    build: ./backend/core-auth
    container_name: core-auth
    ports:
      - "8000:8000"
    networks:
      - app-network

  # =====================
  # UPLOAD SERVICE
  # =====================
  upload-service:
    build: ./backend/upload-service
    container_name: upload-service
    ports:
      - "8002:8002"
    depends_on:
      - minio
      - cassandra
    networks:
      - app-network

  # =====================
  # DOWNLOAD SERVICE
  # =====================
  download-service:
    build: ./backend/download-service
    container_name: download-service
    ports:
      - "8003:8003"
    depends_on:
      - minio
      - cassandra
    networks:
      - app-network

  # =====================
  # ADMIN SERVICE
  # =====================
  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    ports:
      - "8004:8004"
    networks:
      - app-network

  # =====================
  # KEYCLOAK
  # =====================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    networks:
      - app-network

  # =====================
  # MINIO
  # =====================
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # =====================
  # CASSANDRA
  # =====================
  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - app-network

networks:
  app-network:

volumes:
  minio-data:
  cassandra-data: