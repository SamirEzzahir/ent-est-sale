services:


  # =====================
  # GATEWAY
  # =====================
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - core-auth
      - upload-service
      - download-service
      - admin-service
    networks:
      - app-network

  # =====================
  # FRONTEND
  # =====================
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - app-network

  # =====================
  # CORE AUTH
  # =====================
  core-auth:
    build: ./backend/core-auth
    container_name: core-auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # UPLOAD SERVICE
  # =====================
  upload-service:
    build: ./backend/upload-service
    container_name: upload-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started
      cassandra:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # DOWNLOAD SERVICE
  # =====================
  download-service:
    build: ./backend/download-service
    container_name: download-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started
      cassandra:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # ADMIN SERVICE
  # =====================
  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # KEYCLOAK
  # =====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed "s|__PUBLIC_BASE_URL__|$${PUBLIC_BASE_URL}|g" /opt/keycloak/data/import/realm-export.template.json > /opt/keycloak/data/import/realm-export.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --health-enabled=true
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # =====================
  # MINIO
  # =====================
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # =====================
  # CASSANDRA
  # =====================
  cassandra:
    image: cassandra:5.0.4
    container_name: cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10

  cassandra-init:
    image: cassandra:5.0.4
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql
    command: cqlsh cassandra -f /init.cql
    networks:
      - app-network
    restart: on-failure

networks:
  app-network:

volumes:
  minio-data:
  cassandra-data:
