services:

  # =====================
  # GATEWAY (NGINX)
  # =====================
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - core-auth
      - upload-service
      - download-service
      - admin-service
      - ai-assistant-service
    networks:
      - app-network

  # =====================
  # FRONTEND
  # =====================
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - app-network

  # =====================
  # CORE AUTH
  # =====================
  core-auth:
    build: ./backend/core-auth
    container_name: core-auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # UPLOAD SERVICE
  # =====================
  upload-service:
    build: ./backend/upload-service
    container_name: upload-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # DOWNLOAD SERVICE
  # =====================
  download-service:
    build: ./backend/download-service
    container_name: download-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # ADMIN SERVICE
  # =====================
  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # =====================
  # AI ASSISTANT SERVICE
  # =====================
  ai-assistant-service:
    build: ./backend/ai-assistant-service
    container_name: ai-assistant-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
      download-service:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - app-network

  # =====================
  # KEYCLOAK
  # =====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/realms/master || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # =====================
  # MINIO
  # =====================
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # =====================
  # OLLAMA
  # =====================
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network

  # =====================
  # CASSANDRA
  # =====================
  cassandra:
    image: cassandra
    container_name: cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh cassandra -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # =====================
  # CASSANDRA INIT
  # =====================
  cassandra-init:
    image: cassandra
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql
    command: cqlsh cassandra -f /init.cql
    networks:
      - app-network
    restart: on-failure

# =====================
# NETWORKS
# =====================
networks:
  app-network:

# =====================
# VOLUMES
# =====================
volumes:
  minio-data:
  cassandra-data:
  ollama-data:
