services:

  # =====================
  # GATEWAY
  # =====================
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx:ro
    depends_on:
      - frontend
      - core-auth
      - upload-service
      - download-service
      - admin-service
      - ai-assistant-service
    networks:
      - app-network

  # =====================
  # FRONTEND
  # =====================
  frontend:
    build: ./frontend
    container_name: frontend
    # ✅ Remove direct port, nginx handles it
    networks:
      - app-network

  # =====================
  # CORE AUTH
  # =====================
  core-auth:
    build: ./backend/core-auth
    container_name: core-auth
    #ports:
     # - "8001:8001"
    env_file:
      - .env
    # Note: keycloak is in docker-compose.infra.yml
    # It will be available on the shared app-network
    networks:
      - app-network

  # =====================
  # UPLOAD SERVICE
  # =====================
  upload-service:
    build: ./backend/upload-service
    container_name: upload-service
   # ports:
    #  - "8002:8002"
    env_file:
      - .env
    # Note: minio and cassandra are in docker-compose.infra.yml
    # They will be available on the shared app-network
    networks:
      - app-network

  # =====================
  # DOWNLOAD SERVICE
  # =====================
  download-service:
    build: ./backend/download-service
    container_name: download-service
   # ports:
   #   - "8003:8003"
    env_file:
      - .env
    # Note: minio and cassandra are in docker-compose.infra.yml
    # They will be available on the shared app-network
    networks:
      - app-network

  # =====================
  # ADMIN SERVICE
  # =====================
  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
   # ports:
    #  - "8004:8004"
    env_file:
      - .env
    networks:
      - app-network

  # =====================
  # AI ASSISTANT SERVICE
  # =====================
  ai-assistant-service:
    build: ./backend/ai-assistant-service
    container_name: ai-assistant-service
    restart: unless-stopped
   # ports:
   #   - "8005:8005"
    env_file:
      - .env
    depends_on:
      - download-service
    # Note: keycloak and ollama are in docker-compose.infra.yml
    # They will be available on the shared app-network
    networks:
      - app-network

# ================================================================
# Infrastructure services moved to docker-compose.infra.yml
# (Keycloak, Cassandra, MinIO, Ollama)
# ================================================================
# Usage:
#   1. Start infrastructure: docker-compose -f docker-compose.infra.yml up -d
#   2. Start application:    docker-compose up -d
#   3. View all:             docker-compose -f docker-compose.infra.yml -f docker-compose.yml ps
# ================================================================

networks:
  app-network: